<meta name="theme-color" content="#d9c8ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1230;--bg:#fbf5ff;--lav:#d4c4ff;--pink:#ffb6dc;--hot:#ff8fc7;--mint:#b6f0dc;--sky:#a9d6ff;--yel:#fff2a8;--mut:#6a5f82;--disp:'Do Hyeon','Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--hand:'Gaegu','Comic Sans MS',cursive}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--body);font-size:14.5px;line-height:1.75;color:var(--ink);background:#251a45;overflow-x:hidden}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.bgfx{position:fixed;inset:0;background:#251a45 center/cover no-repeat;filter:blur(24px) brightness(.4) saturate(1.3);transform:scale(1.1);z-index:-1}
.app{position:relative;max-width:480px;margin:0 auto;min-height:100vh;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.6);background-color:var(--bg);background-image:radial-gradient(#dccdff 1.3px,transparent 1.6px),linear-gradient(180deg,#fbf5ff,#f1e8ff 35%,#e9f5ff 70%,#fff0f8);background-size:22px 22px,100% 100%}
.side{display:none}
@media(min-width:1100px){
 .side{display:flex;position:fixed;top:0;bottom:0;left:0;width:calc(50% - 240px);flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:40px}
 .side .e{font-family:var(--hand);font-size:24px;color:var(--yel)}
 .side .n{font-family:var(--disp);font-size:84px;line-height:1;margin:8px 0;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
 .side .d{font-size:14px;letter-spacing:.2em;text-transform:uppercase}
 .side .t{margin-top:20px;font-size:13px;opacity:.75}
}

/* ---------- hiasan ---------- */
.dc{position:absolute;pointer-events:none;z-index:0}
.sec>*:not(.dc){position:relative;z-index:1}
.sp{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.85) rotate(0)}50%{transform:scale(1.15) rotate(12deg)}}
.chip{display:inline-block;font-family:var(--disp);font-size:12px;letter-spacing:.08em;padding:2px 12px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);line-height:1.6}
.c-y{background:var(--yel)}.c-p{background:var(--pink)}.c-m{background:var(--mint)}.c-s{background:var(--sky)}.c-l{background:var(--lav)}
.stk{background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink)}

/* ---------- tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--hot);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:12px 26px;font-family:var(--disp);font-size:16px;letter-spacing:.06em;box-shadow:4px 4px 0 var(--ink);text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.o{background:#fff}
.btn.s{padding:7px 16px;font-size:13px;box-shadow:3px 3px 0 var(--ink)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn svg.fl{fill:currentColor}

/* ---------- cover ---------- */
.cover{position:fixed;z-index:60;top:0;bottom:0;left:max(0px,calc(50% - 240px));width:min(100%,480px);display:flex;flex-direction:column;padding:22px 22px 26px;text-align:center;overflow-y:auto;overflow-x:hidden;background:linear-gradient(160deg,#cdb9ff 0%,#ffc2e2 55%,#b9e1ff 100%);transition:transform 1s cubic-bezier(.7,0,.2,1),opacity 1s}
.cover.out{transform:translateY(-101%);opacity:0;pointer-events:none}
.cover::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1.4px,transparent 1.8px);background-size:20px 20px;pointer-events:none}
.cover>*:not(.dc){position:relative;z-index:1}
.ci{margin:auto 0;display:flex;flex-direction:column;align-items:center}
.cv-top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.kr{font-family:var(--hand);font-weight:700;font-size:24px;line-height:1.1;display:inline-block;background:var(--yel);border:2px solid var(--ink);border-radius:12px;padding:2px 14px;transform:rotate(-3deg);margin:14px 0 6px;box-shadow:3px 3px 0 var(--ink)}
.orig{font-size:11px;letter-spacing:.34em;text-transform:uppercase;font-weight:700}
.ttl{font-family:var(--disp);font-size:clamp(58px,min(21vw,11vh),100px);line-height:.92;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);letter-spacing:.01em;word-break:break-word}
.amp{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--hot);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:var(--disp);font-size:24px;margin:6px 0;transform:rotate(-8deg)}
.prem{margin-top:16px;padding:8px 20px;display:inline-flex;gap:10px;align-items:center;font-family:var(--disp);font-size:16px;letter-spacing:.08em;background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.prem small{font-family:var(--body);font-size:10px;letter-spacing:.18em;color:var(--mut)}
.gst{margin:18px 0 18px;padding:12px 18px;max-width:300px;width:100%}
.gst small{display:block;font-size:11px;color:var(--mut);letter-spacing:.06em}
.gst b{display:block;font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.25;overflow-wrap:anywhere}
.gst i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);margin-top:2px}

/* ---------- umum ---------- */
.sec{position:relative;padding:76px 24px;text-align:center;overflow:hidden}
.hd{margin-bottom:30px}
.hd h2{font-family:var(--disp);font-weight:400;font-size:42px;line-height:1.1;margin:8px 0 2px;display:inline-block;background:linear-gradient(transparent 62%,var(--pink) 62%,var(--pink) 92%,transparent 92%);padding:0 6px}
.hd .k{display:block;font-family:var(--hand);font-weight:700;font-size:20px;color:var(--mut)}
.sub{font-size:13.5px;color:var(--mut);margin:0 auto 28px;max-width:320px}
.cap{display:inline-block;background:rgba(10,6,20,.82);color:#fff;font-size:13.5px;padding:3px 12px;border-radius:5px;line-height:1.6}
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.9,.3,1.2)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}

/* ---------- foto latar penuh ---------- */
.fotobg{background:#3a2c5c center/cover no-repeat;color:#fff}
.fotobg::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(40,20,90,.45),rgba(25,12,55,.2) 42%,rgba(25,10,50,.82))}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 22px 120px}
.hero .live{display:inline-flex;align-items:center;gap:7px}
.hero .live::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff3b6b;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.2}}
.hero .ttl{margin:16px 0 6px}
.meta{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:13px;margin:6px 0 12px}
.meta b{color:#7dffb0;font-weight:700}
.meta span.b{border:1.5px solid rgba(255,255,255,.8);padding:0 7px;border-radius:4px;font-size:11px}
.nxt{font-family:var(--hand);font-weight:700;font-size:22px;color:var(--yel);margin:20px 0 6px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px}
.cd div{background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:6px 0 4px}
.cd b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.15}
.cd span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.cdn{font-family:var(--hand);font-weight:700;font-size:22px;color:var(--yel)}
.scroll{margin-top:30px;font-family:var(--hand);font-size:18px;opacity:.9;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* ---------- marquee ---------- */
.mq{background:var(--ink);color:#fff;overflow:hidden;white-space:nowrap;padding:9px 0;font-family:var(--disp);letter-spacing:.14em;font-size:16px;transform:rotate(-2deg);margin:-14px -10px;position:relative;z-index:2;border-top:2px solid #fff;border-bottom:2px solid #fff}
.mq div{display:inline-block;animation:mq 24s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- prolog ---------- */
.bub{position:relative;max-width:340px;margin:0 auto;padding:30px 22px 26px;background:#fff;border:2.5px solid var(--ink);border-radius:30px;box-shadow:6px 6px 0 var(--ink)}
.bub::after{content:"";position:absolute;bottom:-17px;left:44px;width:28px;height:28px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
.bub h3{font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.2;margin-bottom:10px}
.bub p{font-size:13.5px}
.bub .chip{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-2deg)}

/* ---------- pemeran ---------- */
.cast{margin-bottom:12px}
.cast .ph{position:relative;width:min(76%,260px);aspect-ratio:3/4;margin:0 auto;border:3px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:8px 8px 0 var(--ink);background:var(--lav);transform:rotate(-2.5deg)}
.cast.w .ph{transform:rotate(2.5deg);box-shadow:-8px 8px 0 var(--ink)}
.cast .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.cast .tag{position:relative;margin-top:-16px;transform:rotate(-3deg);z-index:2}
.cast.w .tag{transform:rotate(3deg)}
.cast .pn{font-family:var(--disp);font-size:52px;line-height:1.05;margin-top:10px;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.cast .pf{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-top:4px}
.cast .po{font-size:13px;color:var(--mut);margin-top:8px}
.cast .po b{color:var(--ink)}
.ig{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;text-decoration:none;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 14px;box-shadow:2px 2px 0 var(--ink)}
.ig svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plus{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--hot);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-family:var(--disp);font-size:34px;margin:30px 0 24px;transform:rotate(-8deg)}

/* ---------- alur cerita ---------- */
.eps{display:grid;gap:18px;text-align:left}
.ep{display:flex;gap:14px;padding:16px 16px 16px 14px}
.ep:nth-child(odd){transform:rotate(-.8deg)}
.ep:nth-child(even){transform:rotate(.8deg)}
.ep .no{flex:none;width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--disp);font-size:20px;box-shadow:2px 2px 0 var(--ink)}
.ep small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.ep h3{font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.25;margin:0 0 4px}
.ep p{font-size:13.5px}

/* ---------- jadwal tayang (tiket) ---------- */
.tk{position:relative;max-width:350px;margin:0 auto 34px;background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;text-align:center}
.tk:nth-child(odd){transform:rotate(-1deg)}
.tk .th{padding:12px 16px 10px;border-bottom:2.5px solid var(--ink)}
.tk .th span{display:block;font-family:var(--disp);font-size:26px;line-height:1.2}
.tk .th i{font-style:normal;font-family:var(--hand);font-weight:700;font-size:18px;color:var(--mut)}
.tk .tb{padding:16px 18px 20px}
.tk .tgl{font-family:var(--disp);font-size:20px}
.tk .jm{font-size:13.5px;margin-bottom:12px;color:var(--mut)}
.tk .tp{font-weight:700;font-size:14.5px}
.tk .al{font-size:13px;color:var(--mut);margin:2px auto 16px;max-width:260px}
.tk .dv{position:relative;border-top:2.5px dashed var(--ink);margin:0 14px}
.tk .dv::before,.tk .dv::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:2.5px solid var(--ink)}
.tk .dv::before{left:-28px}.tk .dv::after{right:-28px}
.tk .bt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.livew{max-width:340px;margin:0 auto}

/* ---------- foto belakang layar ---------- */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;padding:0 4px}
.gal .pc{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:7px 7px 24px;box-shadow:4px 4px 0 var(--ink);transform:rotate(var(--r,0deg));position:relative}
.gal .pc::after{content:attr(data-n);position:absolute;bottom:2px;left:0;right:0;font-family:var(--hand);font-weight:700;font-size:16px;color:var(--mut)}
.gal .pc:nth-child(4n+1){--r:-2.5deg}.gal .pc:nth-child(4n+2){--r:2deg;margin-top:18px}.gal .pc:nth-child(4n+3){--r:1.5deg}.gal .pc:nth-child(4n){--r:-2deg;margin-top:18px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;cursor:zoom-in;background:var(--lav)}
.lb{position:fixed;inset:0;z-index:120;background:rgba(20,10,40,.95);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:84vh;object-fit:contain;border:3px solid #fff;border-radius:10px}
.lb button{position:absolute;background:var(--hot);border:2px solid #fff;color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:22px}
.lb .x{top:18px;right:18px}.lb .p{left:12px;top:50%}.lb .n{right:12px;top:50%}
.lb .c{position:absolute;bottom:22px;color:#fff;font-size:13px;letter-spacing:.2em}

/* ---------- amplop digital ---------- */
.bank{max-width:340px;margin:0 auto 26px;padding:18px 20px 20px;text-align:left;border-radius:22px;border:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:linear-gradient(135deg,#d4c4ff,#ffb6dc 62%,#fff2a8)}
.bank:nth-of-type(even){background:linear-gradient(135deg,#a9d6ff,#b6f0dc 60%,#fff2a8)}
.bank .bn{font-family:var(--disp);font-size:24px}
.bank .no{font-size:22px;letter-spacing:.12em;margin:10px 0 0;word-break:break-all;font-weight:700}
.bank .an{font-size:13px;margin-bottom:14px}
.bank .ad{font-size:13.5px;margin:8px 0 14px}

/* ---------- komentar ---------- */
.fm{max-width:360px;margin:0 auto;text-align:left;padding:22px 20px 24px}
.fm label.l{display:block;font-family:var(--disp);font-size:14px;letter-spacing:.06em;margin:0 0 4px}
.fm input[type=text],.fm textarea{width:100%;border:2.5px solid var(--ink);border-radius:14px;padding:11px 14px;font:inherit;font-size:14.5px;background:#fff;color:var(--ink);outline:0;margin-bottom:16px}
.fm textarea{min-height:100px;resize:vertical}
.fm input:focus,.fm textarea:focus{box-shadow:3px 3px 0 var(--lav)}
.rd{display:grid;gap:8px;margin:2px 0 16px}
.rd label{display:flex;align-items:center;gap:10px;border:2.5px solid var(--ink);border-radius:14px;padding:9px 14px;font-size:13.5px;cursor:pointer;background:#fff}
.rd input{accent-color:var(--hot);width:16px;height:16px}
.rd label:has(input:checked){background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin-bottom:16px}
.ck input{accent-color:var(--hot);margin-top:5px}
.fm .btn{width:100%}
.cnt{float:right;font-family:var(--body);font-size:11px;color:var(--mut);letter-spacing:0}
.wl{max-width:360px;margin:30px auto 0;max-height:440px;overflow:auto;text-align:left;display:grid;gap:12px;padding:2px 4px 6px 2px;scrollbar-width:thin}
.wi{display:flex;gap:11px;align-items:flex-start}
.av{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--disp);font-size:17px;background:var(--sky);box-shadow:2px 2px 0 var(--ink)}
.wi:nth-child(3n+2) .av{background:var(--pink)}.wi:nth-child(3n) .av{background:var(--mint)}
.wi>div:last-child{flex:1;background:#fff;border:2.5px solid var(--ink);border-radius:4px 18px 18px 18px;padding:8px 13px 8px;box-shadow:3px 3px 0 var(--ink)}
.wi b{font-family:var(--disp);font-weight:400;font-size:15px;overflow-wrap:anywhere}
.wi p{font-size:13.5px;margin-top:1px;overflow-wrap:anywhere;white-space:pre-line}
.bd{display:inline-block;font-family:var(--disp);font-size:10.5px;padding:0 8px;border:1.5px solid var(--ink);border-radius:999px;margin-left:6px;vertical-align:middle;background:var(--mint)}
.bd.t{background:var(--pink)}.bd.r{background:var(--yel)}
.wt{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.emp{font-size:13.5px;color:var(--mut)}

/* ---------- penutup ---------- */
.end{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 24px 150px}
.end .tbc{font-family:var(--disp);font-size:clamp(44px,13vw,60px);line-height:1;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);margin:16px 0 18px}
.end p.t{font-size:14px;line-height:1.85;max-width:320px;margin-bottom:22px}
.end .cr1{font-family:var(--hand);font-weight:700;font-size:20px;color:var(--yel)}
.end .nm{font-family:var(--disp);font-size:46px;line-height:1.1;margin:2px 0 8px;text-shadow:3px 3px 0 var(--ink)}
.end .w{font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:6px}
.end .ct{margin-top:22px}
.end .ft{margin-top:34px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}

/* ---------- navigasi & musik ---------- */
.nav{position:fixed;z-index:50;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;width:min(92vw,400px);transform:translate(-50%,140%);display:flex;justify-content:space-around;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:6px 8px;box-shadow:4px 4px 0 var(--ink);transition:transform .6s cubic-bezier(.2,.8,.2,1.2)}
.nav.on{transform:translate(-50%,0)}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:999px;font-size:9.5px;font-weight:700;text-decoration:none;color:var(--mut);transition:.2s}
.nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--ink);background:var(--hot)}
.nav a svg{transform-origin:50% 60%;animation:wig 2.6s ease-in-out infinite}
.nav a:nth-child(2) svg{animation-delay:.35s}.nav a:nth-child(3) svg{animation-delay:.7s}.nav a:nth-child(4) svg{animation-delay:1.05s}.nav a:nth-child(5) svg{animation-delay:1.4s}.nav a:nth-child(6) svg{animation-delay:1.75s}
.nav a[data-s=hadiah]:not(.on) svg{color:var(--hot)}
.nav a.on svg{animation:pop 1.6s ease-in-out infinite}

var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

var ZONA=OFS[D.zona]?D.zona:'WIB';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tgl(s){var p=String(s||'').split('-');if(p.length<3)return '';var d=new Date(+p[0],+p[1]-1,+p[2]);return HARI[d.getDay()]+', '+(+p[2])+' '+BLN[+p[1]-1]+' '+p[0]}
function jam(s){return String(s||'').replace(':','.')}
function rentang(e){return jam(e.jamMulai)+(e.jamSelesai?' - '+jam(e.jamSelesai):' - selesai')+' '+ZONA}
function wkt(tg,jm){return new Date(tg+'T'+(jm||'00:00')+':00'+OFS[ZONA])}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2800)}
function salin(txt,pesan){

  function fb(){var a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Gagal menyalin')}a.remove()}
}
function ago(d){var s=(Date.now()-d.getTime())/1000;if(s<60)return 'baru saja';if(s<3600)return Math.floor(s/60)+' menit lalu';if(s<86400)return Math.floor(s/3600)+' jam lalu';if(s<2592000)return Math.floor(s/86400)+' hari lalu';return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()}

/* ---------- perilaku ---------- */
function countdown(){
  var el=$('#cd');if(!el||!ak&&!rs)return;
  var tgt=wkt(utama.tanggal,utama.jamMulai).getTime();
  function t(){
    var d=tgt-Date.now();
    if(d<=0){el.style.display='block';el.style.border='0';el.className='cdn rv in';el.textContent='Alhamdulillah, acara telah berlangsung. Terima kasih atas doa Anda.';return}
    var s=Math.floor(d/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
    el.innerHTML=[[dd,'Hari'],[hh,'Jam'],[mm,'Menit'],[ss,'Detik']].map(function(x){return '<div><b>'+String(x[0]).padStart(2,'0')+'</b><span>'+x[1]+'</span></div>'}).join('');
    setTimeout(t,1000);
  }
  t();
}
function reveal(){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
  $$('.rv').forEach(function(e){io.observe(e)});
}
function nav(){
  var items=[['beranda','home','Awal'],['mempelai','heart','Cast'],['acara','cal','Jadwal'],['galeri','img','Foto'],['hadiah','gift','Gift'],['ucapan','msg','Komen']].filter(function(i){return $('#'+i[0])});
  $('#nav').innerHTML=items.map(function(i){return '<a href="#'+i[0]+'" data-s="'+i[0]+'"><svg viewBox="0 0 24 24">'+IC[i[1]]+'</svg>'+i[2]+'</a>'}).join('');
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){$$('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.s===e.target.id)})}})},{rootMargin:'-45% 0px -50% 0px'});
  items.forEach(function(i){io.observe($('#'+i[0]))});
}
function galeri(){
  var g=$('#gal');if(!g)return;var lb=$('#lb'),im=$('img',lb),c=$('.c',lb),cur=0,L=D.galeri;
  function show(i){cur=(i+L.length)%L.length;im.src=L[cur];c.textContent=(cur+1)+' / '+L.length}
  g.addEventListener('click',function(e){var t=e.target.closest('img');if(!t)return;show(+t.dataset.i);lb.classList.add('on')});
  $('.x',lb).onclick=function(){lb.classList.remove('on')};
  $('.p',lb).onclick=function(){show(cur-1)};$('.n',lb).onclick=function(){show(cur+1)};
  lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('on')});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
  var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));x0=null});
}
function musik(){
  var a=$('#aud'),b=$('#mu');
  if(!D.musik){return {mulai:function(){}}}
  a.src=D.musik;var gagal=false;
  a.addEventListener('error',function(){if(!gagal){gagal=true;toast('Musik tidak dapat diputar. Periksa file musik.')}b.classList.remove('play')});
  a.addEventListener('play',function(){b.classList.add('play')});a.addEventListener('pause',function(){b.classList.remove('play')});
  b.onclick=function(){if(a.paused){a.play().catch(function(){toast('Musik tidak dapat diputar. Periksa file musik.')})}else a.pause()};
  return {mulai:function(){b.classList.add('on');a.play().catch(function(){})}};
}

/* ---------- ucapan ---------- */
var LKEY='ucapan_'+(D.kode||'x');
function lokal(){try{return JSON.parse(localStorage.getItem(LKEY)||'[]').map(function(u){u.waktu=new Date(u.waktu);return u})}catch(e){return []}}
function simpanLokal(u){try{var l=JSON.parse(localStorage.getItem(LKEY)||'[]');l.unshift(u);localStorage.setItem(LKEY,JSON.stringify(l.slice(0,50)))}catch(e){}}
var HD={hadir:['Hadir',''],tidak:['Berhalangan','t'],ragu:['Ragu','r']};
function daftar(){
  var el=$('#wl');if(!el)return;
  function tampil(arr,catatan){
    if(!arr.length){el.innerHTML='<div class="emp">'+esc(catatan||'Jadilah yang pertama mengirimkan ucapan.')+'</div>';return}
    el.innerHTML=arr.map(function(u){var b=HD[u.hadir]||HD.hadir;return '<div class="wi"><div class="av">'+esc((u.nama||'?').trim().charAt(0).toUpperCase())+'</div><div><b>'+esc(u.nama)+'</b><span class="bd '+b[1]+'">'+b[0]+'</span><p>'+esc(u.isi)+'</p><span class="wt">'+esc(ago(u.waktu))+'</span></div></div>'}).join('');
  }
  var seed=(D.ucapan||[]).map(function(u){return {nama:u.nama,isi:u.isi,hadir:u.hadir||'hadir',waktu:new Date(u.waktu||Date.now())}});
  if(!S.ucapanPublik){tampil([], 'Ucapan hanya dapat dibaca oleh mempelai. Terima kasih atas doa Anda.');return}
  if(FB.aktif){FB.daftarUcapan(false).then(function(a){tampil(a)}).catch(function(){tampil(lokal().concat(seed))})}
  else tampil(lokal().concat(seed));
}
function form(){
  var f=$('#fm');if(!f)return;
  $('#fi').addEventListener('input',function(){$('#cnt').textContent=this.value.length+'/300'});
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var nama=$('#fn').value.trim(),isi=$('#fi').value.trim(),hd=(f.querySelector('input[name=hd]:checked')||{}).value||'hadir';
    if(!nama||!isi){toast('Nama dan ucapan wajib diisi');return}
    var btn=$('#fs');btn.disabled=true;
    var u={nama:nama.slice(0,40),isi:isi.slice(0,300),hadir:hd};
    var wa=$('#fw')&&$('#fw').checked;
    function selesai(){
      toast('Ucapan terkirim. Terima kasih!');$('#fi').value='';$('#cnt').textContent='0/300';btn.disabled=false;daftar();
      if(wa){var st={hadir:'Insya Allah hadir',tidak:'Mohon maaf, belum bisa hadir',ragu:'Masih ragu'}[hd];
        window.open('https://wa.me/'+String(D.pemesan.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent('Assalamu\'alaikum, saya '+u.nama+'.\nKonfirmasi kehadiran: '+st+'.\n\nUcapan: '+u.isi),'_blank')}
    }
    if(FB.aktif){FB.kirimUcapan(u).then(selesai).catch(function(){btn.disabled=false;toast('Ucapan gagal terkirim. Coba lagi.')})}
    else{u.waktu=new Date();simpanLokal(u);selesai()}
  });
}

/* ---------- pengaturan dari admin ---------- */
function terapkan(){
  $$('#bank [data-r]').forEach(function(e){e.style.display=S.rek[+e.dataset.r]===false?'none':''});
  if(S.turut&&D.turutMengundang&&D.turutMengundang.length){var t=$('#turut');t.style.display='';$('#tm').innerHTML=D.turutMengundang.map(esc).join('<br>');t.querySelectorAll('.rv').forEach(function(e){e.classList.add('in')})}
}
function muatPengaturan(){
  if(!FB.aktif)return Promise.resolve();
  return FB.pengaturan().then(function(p){if(!p)return;
    if(typeof p.ucapanPublik==='boolean')S.ucapanPublik=p.ucapanPublik;
    if(typeof p.turutTampil==='boolean')S.turut=p.turutTampil;
    if(typeof p.rekening1==='boolean')S.rek[0]=p.rekening1;
    if(typeof p.rekening2==='boolean')S.rek[1]=p.rekening2;
  }).catch(function(){});
}

/* ---------- mulai ---------- */
build();
$('#bgfx').style.backgroundImage=F.sampul?'url('+F.sampul+')':'';
$('#side').innerHTML='<div class="e">The Wedding Of</div><div class="n">'+esc(NAMA)+'</div>'+(utama?'<div class="d">'+esc(tgl(utama.tanggal))+'</div>':'')+(tamu?'<div class="t">Kepada Yth. '+esc(tamu)+'</div>':'');
var M=musik();
reveal();countdown();nav();galeri();form();
muatPengaturan().then(function(){terapkan();daftar()});
$$('[data-cp]').forEach(function(b){b.onclick=function(){salin(b.dataset.cp,'Berhasil disalin')}});
$('#buka').onclick=function(){
  $('#cover').classList.add('out');document.body.classList.remove('lock');M.mulai();
  setTimeout(function(){$('#nav').classList.add('on')},700);window.scrollTo(0,0);
};
})();
</script>
</body>
